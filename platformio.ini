[platformio]
default_envs = mega

[env]
framework = arduino
platform = atmelavr
monitor_speed = 115200
build_flags = -DREVDUINO_MAIN

[env:uno]
board = uno
build_flags = ${env.build_flags} -DEXAMPLE_COLOR_SENSOR

[env:mega]
board = megaatmega2560
build_flags = ${env.build_flags} -DEXAMPLE_COLOR_SENSOR

[env:uno_normalized]
extends = env:uno
build_flags = ${env.build_flags} -DEXAMPLE_NORMALIZED_COLOR

[env:mega_normalized]
extends = env:mega
build_flags = ${env.build_flags} -DEXAMPLE_NORMALIZED_COLOR
