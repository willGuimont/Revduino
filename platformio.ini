[platformio]
default_envs = mega

[avr]
framework = arduino
platform = atmelavr
lib_deps =
    adafruit/Adafruit BusIO@^1.17.4
monitor_speed = 115200
build_flags = -DREVDUINO_MAIN

[env:uno]
extends = avr
board = uno
build_flags = ${avr.build_flags} -DEXAMPLE_COLOR_SENSOR

[env:mega]
extends = avr
board = megaatmega2560
build_flags = ${avr.build_flags} -DEXAMPLE_COLOR_SENSOR

[env:uno_status]
extends = avr
board = uno
build_flags = ${avr.build_flags} -DEXAMPLE_COLOR_SENSOR_STATUS

[env:mega_status]
extends = avr
board = megaatmega2560
build_flags = ${avr.build_flags} -DEXAMPLE_COLOR_SENSOR_STATUS

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++11
